<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="128" viewBox="0 0 384 128">
  <defs>
    <style>
      .skin { fill: #f2c79e; }
      .hair { fill: #ffd54d; }
      .shirt { fill: #ffffff; }
      .pants { fill: #e89876; }
      .shoe { fill: #10131a; }
      .shadow { fill: #1c202b; opacity: .25; }
      .stroke { stroke: #2a2e3c; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <!-- FRAME 1: walk-left -->
  <g transform="translate(0,0)">
    <ellipse class="shadow" cx="64" cy="108" rx="26" ry="6"/>
    <!-- legs -->
    <path class="stroke" d="M60,92 L48,104" />
    <path class="stroke" d="M70,92 L86,108" />
    <!-- pants block -->
    <rect class="pants" x="48" y="72" rx="8" ry="8" width="44" height="32"/>
    <!-- shirt -->
    <rect class="shirt" x="46" y="56" rx="8" ry="8" width="48" height="22"/>
    <!-- arm -->
    <path class="stroke" d="M52,66 L68,74" />
    <!-- head -->
    <circle class="skin" cx="62" cy="48" r="9"/>
    <!-- hair -->
    <ellipse class="hair" cx="66" cy="52" rx="12" ry="9"/>
    <!-- shoes -->
    <rect class="shoe" x="40" y="104" width="14" height="6" rx="2"/>
    <rect class="shoe" x="86" y="108" width="14" height="6" rx="2"/>
  </g>

  <!-- FRAME 2: walk-right -->
  <g transform="translate(128,0)">
    <ellipse class="shadow" cx="64" cy="108" rx="26" ry="6"/>
    <path class="stroke" d="M60,92 L44,108" />
    <path class="stroke" d="M70,92 L82,104" />
    <rect class="pants" x="48" y="72" rx="8" ry="8" width="44" height="32"/>
    <rect class="shirt" x="46" y="56" rx="8" ry="8" width="48" height="22"/>
    <path class="stroke" d="M54,66 L70,74" />
    <circle class="skin" cx="62" cy="48" r="9"/>
    <ellipse class="hair" cx="66" cy="52" rx="12" ry="9"/>
    <rect class="shoe" x="34" y="108" width="14" height="6" rx="2"/>
    <rect class="shoe" x="82" y="104" width="14" height="6" rx="2"/>
  </g>

  <!-- FRAME 3: kick -->
  <g transform="translate(256,0)">
    <ellipse class="shadow" cx="64" cy="108" rx="26" ry="6"/>
    <path class="stroke" d="M58,92 L42,108" />
    <path class="stroke" d="M72,90 L96,84" />
    <rect class="pants" x="48" y="72" rx="8" ry="8" width="44" height="32"/>
    <rect class="shirt" x="46" y="56" rx="8" ry="8" width="48" height="22"/>
    <path class="stroke" d="M54,66 L70,70" />
    <circle class="skin" cx="62" cy="48" r="9"/>
    <ellipse class="hair" cx="66" cy="52" rx="12" ry="9"/>
    <rect class="shoe" x="34" y="108" width="14" height="6" rx="2"/>
    <rect class="shoe" x="96" y="82" width="16" height="6" rx="2"/>
  </g>
</svg>
